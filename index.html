<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>午睡の音源を聴こう</title>

    <style>
        body {
            background-image: url('hosi.png');
            background-size: 70%;
            margin: 0;
            padding: 10px;
            font-family: sans-serif;
        }

        .header-box {
            background-color: #74B5EA;
            color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .content {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .content img {
            width: 100%;
            height: auto;
            display: block;
        }

        .content audio {
            width: 100%;
            display: block;
            margin: 10px 0;
        }

        /* --- ライブ情報用カードのスタイル --- */
        .live-card {
            background-color: #ffffff;
            border-radius: 0px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .live-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .live-info {
            padding: 15px;
        }

        .live-date {
            font-size: 1.2rem;
            color: #74B5EA;
            font-weight: bold;
        }

        .live-title {
            font-size: 1.0rem;
            font-weight: bold;
            margin: 5px 0 10px 0;
            color: #333;
        }

        .live-detail {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 6px;
        }

        .ticket-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #74B5EA;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Instagram埋め込み枠のコンパクト化設定 */
        .insta-container {
            max-width: 320px;
            max-height: 480px;
            overflow: hidden;
            margin: 15px auto 5px auto;
            border-radius: 8px;
        }

        .insta-container iframe {
            max-height: 480px !important;
        }

        /* ハンバーガーボタン & メニュー */
        .menu-btn {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 22px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
        }

        .menu-btn span {
            width: 100%;
            height: 3px;
            background-color: #333;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .menu-btn.active span:nth-child(1) { transform: translateY(9.5px) rotate(45deg); }
        .menu-btn.active span:nth-child(2) { opacity: 0; }
        .menu-btn.active span:nth-child(3) { transform: translateY(-9.5px) rotate(-45deg); }

        .nav-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 200px;
            height: 100vh;
            background-color: #ffffff;
            padding-top: 60px;
            transition: right 0.3s ease;
            z-index: 999;
        }

        .nav-menu.active { right: 0; }
        .nav-menu ul { list-style: none; padding: 0; margin: 0; }
        .nav-menu li a { display: block; padding: 15px 20px; color: #333; text-decoration: none; }
    </style>
</head>
<body>

    <button class="menu-btn" id="menuBtn">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="nav-menu" id="navMenu">
        <ul>
            <li><a href="hennayume.html">変な夢</a></li>
        </ul>
    </nav>

    <div class="header-box">
        <h1>午睡の音源を聴けるサイト</h1>
        <p>
            宮崎で午睡というバンドをやっています。サイトを訪れてくれてありがとう
            <br><br>
            Gt. Vo. みのわ / Gt. たける / Ba. あこ / Dr.なずな
        </p>
    </div>

   

        <!-- アーティスト写真 -->
        <img src="minna.jpg" alt="みんなの写真">
        <br><br>

        <p>SNSやっています<br>@gosui_band</p>
        <div style="margin-top: 15px;">
            <a href="https://instagram.com/gosui_band" target="_blank" style="display: inline-block; padding: 8px 16px; background-color:white; color: black; text-decoration: none; border-radius: 20px; font-weight: bold; margin-right: 10px; border: 1px solid #ccc;">Instagram</a>
            <a href="https://twitter.com/gosui_band" target="_blank" style="display: inline-block; padding: 8px 16px; background-color: #0072FF; color: white; text-decoration: none; border-radius: 20px; font-weight: bold;">Twitter</a>
        </div>

        <br><br>

        <p>町</p>
        <audio controls src="machinouta.mp3"></audio>

        <p>ずる休み</p>
        <audio controls src="zuruyasumi.mp3"></audio>

        <p>○○（バンドデモ）</p>
        <audio controls src="maruband.mp3"></audio>

        <p>東京の歌</p>
        <audio controls src="tokyonouta.mp3"></audio>

        <br><br>
    
     <div class="content">

        <!-- ライブ情報一覧がここに自動挿入されます -->
        <h2>ライブの予定　（チケットお問い合わせはinstagramまで）</h2></h2>
        <div id="live-list">読み込み中...</div>

        <br><br>

        <img src="machi.png" alt="町写真">
        <br><br>

        <p>おまけの絵</p>
        <img src="mini.png" alt="ミニアルバム">
        <br><br>
        <img src="ikanoe.png" alt="イカ捌き">
        <br><br>
    </div>

    <script>
        // ハンバーガーメニュー
        const menuBtn = document.getElementById('menuBtn');
        const navMenu = document.getElementById('navMenu');
        menuBtn.addEventListener('click', () => {
            menuBtn.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        // --- スプレッドシートからライブ情報を取得する処理 ---
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT96atfvOdnuGXFJcWY5quqfuoo_0DMqOi6rfP_YuKE3l_ogg9VUbfzDi7drIbG-FgtiUMpauMZZrCL/pub?output=csv';

        function parseCSV(text) {
            const lines = text.trim().split(/\r?\n/);
            return lines.map(line => {
                const row = [];
                let insideQuote = false;
                let entry = '';
                for (let char of line) {
                    if (char === '"') {
                        insideQuote = !insideQuote;
                    } else if (char === ',' && !insideQuote) {
                        row.push(entry.trim().replace(/^"(.*)"$/, '$1'));
                        entry = '';
                    } else {
                        entry += char;
                    }
                }
                row.push(entry.trim().replace(/^"(.*)"$/, '$1'));
                return row;
            });
        }

        // Instagramスクリプトを動的にロードする関数
        function loadInstagramScript() {
            if (!document.getElementById('insta-embed-script')) {
                const script = document.createElement('script');
                script.id = 'insta-embed-script';
                script.src = 'https://www.instagram.com/embed.js';
                script.async = true;
                document.body.appendChild(script);
            } else if (window.instgrm && window.instgrm.Embeds) {
                window.instgrm.Embeds.process();
            }
        }

        async function fetchLiveSchedule() {
            const container = document.getElementById('live-list');

            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('ネットワーク応答エラー');
                
                const data = await response.text();
                const rows = parseCSV(data);
                const items = rows.slice(1); // ヘッダー除外

                if (items.length === 0 || !items[0][0]) {
                    container.innerHTML = '<p>現在予定されているライブはありません。</p>';
                    return;
                }

                let html = '';
                items.forEach(row => {
                    const [date, title, place, time, image, ticket] = row;

                    if (!date && !title) return;

                    let mediaHtml = '';
                    if (image) {
                        if (image.includes('instagram.com/p/') || image.includes('instagram.com/reel/')) {
                            // 個別投稿URLの場合
                            mediaHtml = `
                                <div class="insta-container">
                                    <blockquote class="instagram-media" data-instgrm-permalink="${image}" data-instgrm-version="14" style="width:100%; margin:0; padding:0;"></blockquote>
                                </div>
                            `;
                        } else if (image.includes('instagram.com')) {
                            // 個別投稿以外のInstagramリンクの場合
                            mediaHtml = `<div style="margin-top:10px;"><a href="${image}" target="_blank" class="ticket-btn" style="background-color:#E1306C;">Instagram投稿を見る</a></div>`;
                        } else {
                            // 通常画像の場合
                            mediaHtml = `<img src="${image}" alt="${title || ''}" style="margin-top:10px; border-radius:8px;">`;
                        }
                    }

                    html += `
                        <div class="live-card">
                            <div class="live-info">
                                <div class="live-date">${date || ''}</div>
                                <div class="live-title">${title || ''}</div>
                                ${place ? `<div class="live-detail">場所: ${place}</div>` : ''}
                                ${time ? `<div class="live-detail">時間: ${time}</div>` : ''}
                                ${ticket ? `<a href="${ticket}" target="_blank" rel="noopener noreferrer" class="ticket-btn">チケット予約・詳細</a>` : ''}
                                ${mediaHtml}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

                // スクリプトを呼び出して埋め込みを完了させる
                loadInstagramScript();

            } catch (error) {
                console.error('読み込みエラー:', error);
                container.innerHTML = '<p>ライブ情報の読み込みに失敗しました。</p>';
            }
        }

        fetchLiveSchedule();
    </script>
</body>
</html>
