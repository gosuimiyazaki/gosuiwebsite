```html
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <!-- スマホで適切な縮尺で表示させるためのタグ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>午睡の音源を聴こう</title>

    <style>
        body {
            background-image: url('hosi.png');
            background-size: 70%;
            margin: 0;
            padding: 10px;
        }

        .header-box {
            background-color: #74B5EA;
            color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .content {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .content img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* オーディオプレイヤー */
        .content audio {
            width: 100%;
            display: block;
            margin: 10px 0;
        }

        /* ライブ情報カード */
        .live-card {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            word-break: break-all;
        }

        .live-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .live-date,
        .live-detail {
            font-size: 0.95rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }

        .ticket-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #74B5EA;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .live-card img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin-top: 10px;
        }

        /* Instagram埋め込み */
        .insta-container {
            max-width: 320px;
            max-height: 480px;
            overflow: hidden;
            margin: 15px auto 5px auto;
            border-radius: 8px;
        }

        .insta-container iframe {
            max-height: 480px !important;
        }

        /* ハンバーガーボタン */
        .menu-btn {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 22px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
        }

        .menu-btn span {
            width: 100%;
            height: 3px;
            background-color: #333;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .menu-btn.active span:nth-child(1) {
            transform: translateY(9.5px) rotate(45deg);
        }

        .menu-btn.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-btn.active span:nth-child(3) {
            transform: translateY(-9.5px) rotate(-45deg);
        }

        /* ナビゲーションメニュー */
        .nav-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 200px;
            height: 100vh;
            background-color: #ffffff;
            padding-top: 60px;
            transition: right 0.3s ease;
            z-index: 999;
        }

        .nav-menu.active {
            right: 0;
        }

        .nav-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-menu li a {
            display: block;
            padding: 15px 20px;
            color: #333;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <!-- ハンバーガーボタン -->
    <button class="menu-btn" id="menuBtn">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- ナビゲーション -->
    <nav class="nav-menu" id="navMenu">
        <ul>
            <li>
                <a href="hennayume.html">変な夢</a>
            </li>
        </ul>
    </nav>

    <!-- ヘッダー -->
    <div class="header-box">
        <h1>午睡の音源を聴けるサイト</h1>

        <p>
            宮崎で午睡というバンドをやっています。サイトを訪れてくれてありがとう
            <br><br>
            Gt. Vo. みのわ / Gt. たける / Ba. あこ / Dr.なずな
        </p>
    </div>

    <div class="content">

        <!-- みんなの写真 -->
        <img src="minna.jpg" alt="みんなの写真">

        <br><br>

        <!-- SNS -->
        <p>
            SNSやっています<br>
            @gosui_band
        </p>

        <div style="margin-top: 15px;">

            <a
                href="https://instagram.com/gosui_band"
                target="_blank"
                style="
                    display: inline-block;
                    padding: 8px 16px;
                    background-color: white;
                    color: black;
                    text-decoration: none;
                    border-radius: 20px;
                    font-weight: bold;
                    margin-right: 10px;
                "
            >
                Instagram
            </a>

            <a
                href="https://twitter.com/gosui_band"
                target="_blank"
                style="
                    display: inline-block;
                    padding: 8px 16px;
                    background-color: #0072FF;
                    color: white;
                    text-decoration: none;
                    border-radius: 20px;
                    font-weight: bold;
                "
            >
                Twitter
            </a>

        </div>

        <br><br>

        <!-- 音源 -->

        <p>町</p>
        <audio controls src="machinouta.mp3"></audio>

        <p>ずる休み</p>
        <audio controls src="zuruyasumi.mp3"></audio>

        <p>○○（バンドデモ）</p>
        <audio controls src="maruband.mp3"></audio>

        <p>東京の歌</p>
        <audio controls src="tokyonouta.mp3"></audio>

        <br><br>

        <!-- 町の写真 -->
        <img src="machi.png" alt="町写真">

        <br><br>
   　　<p>次回のライブ</p>
        <!-- ライブ情報 -->
        <div id="live-list" style="min-height: 50px;">
            読み込み中...
        </div>

        <br><br>

        <!-- おまけ -->
        <p>おまけの絵</p>

        <!-- ミニアルバム -->
        <img src="mini.png" alt="ミニアルバム">

        <br><br>

        <!-- イカ捌き -->
        <img src="ikanoe.png" alt="イカ捌き">

        <br><br>

    </div>


    <script>

        /* ========================================
           ハンバーガーメニュー
        ======================================== */

        const menuBtn = document.getElementById('menuBtn');
        const navMenu = document.getElementById('navMenu');

        menuBtn.addEventListener('click', () => {

            menuBtn.classList.toggle('active');
            navMenu.classList.toggle('active');

        });


        /* ========================================
           Googleスプレッドシート
        ======================================== */


const SPREADSHEET_URL =
  'https://docs.google.com/spreadsheets/d/e/2PACX-1vT96atfvOdnuGXFJcWY5quqfuoo_0DMqOi6rfP_YuKE3l_ogg9VUbfzDi7drIbG-FgtiUMpauMZZrCL/pub?output=csv';

const liveList = document.getElementById('live-list');

fetch(SPREADSHEET_URL)
  .then(response => {
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    return response.text();
  })
  .then(csv => {
    console.log('CSV:', csv);

    // CSVを正しく読み込む
    const rows = [];
    let row = [];
    let cell = '';
    let insideQuotes = false;

    for (let i = 0; i < csv.length; i++) {
      const char = csv[i];
      const next = csv[i + 1];

      if (char === '"' && insideQuotes && next === '"') {
        cell += '"';
        i++;
      } else if (char === '"') {
        insideQuotes = !insideQuotes;
      } else if (char === ',' && !insideQuotes) {
        row.push(cell);
        cell = '';
      } else if ((char === '\n' || char === '\r') && !insideQuotes) {
        if (char === '\r' && next === '\n') {
          i++;
        }

        row.push(cell);
        cell = '';

        if (row.some(value => value.trim() !== '')) {
          rows.push(row);
        }

        row = [];
      } else {
        cell += char;
      }
    }

    // 最後の行
    if (cell !== '' || row.length > 0) {
      row.push(cell);

      if (row.some(value => value.trim() !== '')) {
        rows.push(row);
      }
    }

    console.log('読み込んだデータ:', rows);

    // ヘッダーを除く
    const dataRows = rows.slice(1);

    liveList.innerHTML = '';

    if (dataRows.length === 0) {
      liveList.textContent = 'ライブ情報はありません。';
      return;
    }

 dataRows.forEach(row => {
  const [
    date,
    title,
    place,
    time,
    image,
    ticket
  ] = row;

  if (!date && !title && !place) return;

  const live = document.createElement('div');
  live.className = 'live-card';

  live.innerHTML = `
    <div class="live-date">${date || ''}</div>

    <div class="live-title">${title || ''}</div>

    <div class="live-detail">
      ${time ? `時間：${time}<br>` : ''}
      ${place ? `会場：${place}` : ''}
    </div>

    ${
      image
        ? `
          <blockquote
            class="instagram-media"
            data-instgrm-permalink="${image}"
            data-instgrm-version="14"
            style="width:100%; margin:10px 0;">
          </blockquote>
        `
        : ''
    }

    ${
      ticket
        ? `<a class="ticket-btn" href="${ticket}" target="_blank" rel="noopener">
            チケット・詳細
          </a>`
        : ''
    }
  `;

  liveList.appendChild(live);
});

  // Instagramの埋め込みを読み込む
  if (window.instgrm) {
    window.instgrm.Embeds.process();
  }

})

.catch(error => {
  console.error('ライブ情報の読み込みに失敗:', error);

  liveList.innerHTML =
    '<p>ライブ情報を読み込めませんでした。</p>';
});
</script>
<script async src="https://www.instagram.com/embed.js"></script>
</body>
</html>
