<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホで適切な縮尺で表示させるための必須タグ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>午睡の音源を聴こう</title>

    <style>
        body {
            background-image: url('hosi.png');
            background-size: 70%;
            margin: 0;
            padding: 10px;
        }

        .header-box {
            background-color: #74B5EA;
            color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .content {
            width: 100%;
            max-width: 600px; /* プレイヤーが小さくなりすぎないよう幅を拡張 */
            margin: 0 auto;
            box-sizing: border-box;
        }

        .content img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* オーディオプレイヤーの幅を100%にして表示崩れを防ぐ */
        .content audio {
            width: 100%;
            display: block;
            margin: 10px 0;
        }

        /* ライブ情報カードのスマホ最適化スタイル */
        .live-card {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            word-break: break-all;
        }

        .live-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .live-date, .live-detail {
            font-size: 0.95rem;
            color: #333;
            margin-bottom: 4px;
        }

        .ticket-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #74B5EA;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .live-card img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin-top: 10px;
        }

        /* Instagram埋め込み枠のコンパクト化設定 */
        .insta-container {
            max-width: 320px;
            max-height: 480px;
            overflow: hidden;
            margin: 15px auto 5px auto;
            border-radius: 8px;
        }

        .insta-container iframe {
            max-height: 480px !important;
        }

        /* ハンバーガーボタン & メニュー */
        .menu-btn {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 22px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
        }

        .menu-btn span {
            width: 100%;
            height: 3px;
            background-color: #333;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .menu-btn.active span:nth-child(1) {
            transform: translateY(9.5px) rotate(45deg);
        }

        .menu-btn.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-btn.active span:nth-child(3) {
            transform: translateY(-9.5px) rotate(-45deg);
        }

        .nav-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 200px;
            height: 100vh;
            background-color: #ffffff;
            padding-top: 60px;
            transition: right 0.3s ease;
            z-index: 999;
        }

        .nav-menu.active {
            right: 0;
        }

        .nav-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-menu li a {
            display: block;
            padding: 15px 20px;
            color: #333;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <button class="menu-btn" id="menuBtn">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="nav-menu" id="navMenu">
        <ul>
            <li><a href="hennayume.html">変な夢</a></li>
        </ul>
    </nav>

    <div class="header-box">
        <h1>午睡の音源を聴けるサイト</h1>
        <p>
            宮崎で午睡というバンドをやっています。サイトを訪れてくれてありがとう
            <br><br>
            Gt. Vo. みのわ / Gt. たける / Ba. あこ / Dr.なずな
        </p>
    </div>

    <div class="content">

        <!-- みんなの写真 -->
        <img src="minna.jpg" alt="みんなの写真">
        <br><br>

        <p>SNSやっています<br>@gosui_band</p>
        <div style="margin-top: 15px;">
            <a href="https://instagram.com/gosui_band" target="_blank" style="display: inline-block; padding: 8px 16px; background-color:white; color: black; text-decoration: none; border-radius: 20px; font-weight: bold; margin-right: 10px;">Instagram</a>
            <a href="https://twitter.com/gosui_band" target="_blank" style="display: inline-block; padding: 8px 16px; background-color: #0072FF; color: white; text-decoration: none; border-radius: 20px; font-weight: bold;">Twitter</a>
        </div>

        <br><br>

        
        <p>町</p>
        <audio controls src="machinouta.mp3"></audio>

        <p>ずる休み</p>
        <audio controls src="zuruyasumi.mp3"></audio>

        <p>○○（バンドデモ）</p>
        <audio controls src="maruband.mp3"></audio>

        <p>東京の歌</p>
        <audio controls src="tokyonouta.mp3"></audio>

        <br><br>

       <!-- 町の写真 -->
        <img src="machi.png" alt="町写真">
        <br><br>

        <!-- ライブ情報枠 -->
        <div id="live-list" style="min-height: 50px;">読み込み中...</div>
        <br><br>

        <p>おまけの絵</p>

        <!-- ミニアルバム -->
        <img src="mini.png" alt="ミニアルバム">
        <br><br>

        <!-- イカ捌き -->
        <img src="ikanoe.png" alt="イカ捌き">
        <br><br>

    </div>

    <script>
        // ハンバーガーメニューの開閉処理
        const menuBtn = document.getElementById('menuBtn');
        const navMenu = document.getElementById('navMenu');

        menuBtn.addEventListener('click', () => {
            menuBtn.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        // スプレッドシートからのライブ情報読み込み処理
        const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT96atfvOdnuGXFJcWY5quqfuoo_0DMqOi6rfP_YuKE3l_ogg9VUbfzDi7drIbG-FgtiUMpauMZZrCL/gviz/tq?tqx=out:json';

        window.addEventListener('DOMContentLoaded', () => {
            fetch(SPREADSHEET_URL)
                .then(response => response.text())
                .then(text => {
                    const jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                    const data = JSON.parse(jsonText);
                    
                    const rows = data.table.rows;
                    const container = document.getElementById('live-list');

                    if (!rows || rows.length <= 1) {
                        container.innerHTML = '<p>現在予定されているライブはありません。</p>';
                        return;
                    }

                    let html = '';
                    rows.slice(1).forEach(row => {
                        const cells = row.c;
                        if (!cells) return;

                        const date  = cells[0] && cells[0].v ? cells[0].v : '';
                        const title = cells[1] && cells[1].v ? cells[1].v : '';
                        const place = cells[2] && cells[2].v ? cells[2].v : '';
                        const time  = cells[3] && cells[3].v ? cells[3].v : '';
                        const image = cells[4] && cells[4].v ? cells[4].v : '';
                        const ticket= cells[5] && cells[5].v ? cells[5].v : '';

                        if (!date && !title) return;

                        let mediaHtml = '';
                        if (image) {
                            if (image.includes('instagram.com')) {
                                mediaHtml = `<div class="insta-container"><iframe src="${image}/embed" width="100%" height="480" frameborder="0" scrolling="no" allowtransparency="true"></iframe></div>`;
                            } else {
                                mediaHtml = `<img src="${image}" alt="${title}">`;
                            }
                        }

                        html += `
                            <div class="live-card">
                                <div class="live-info">
                                    <div class="live-date">${date}</div>
                                    <div class="live-title">${title}</div>
                                    ${place ? `<div class="live-detail">場所: ${place}</div>` : ''}
                                    ${time ? `<div class="live-detail">時間: ${time}</div>` : ''}
                                    ${ticket ? `<a href="${ticket}" target="_blank" rel="noopener noreferrer" class="ticket-btn">チケット予約・詳細</a>` : ''}
                                    ${mediaHtml}
                                </div>
                            </div>
                        `;
                    });

                    container.innerHTML = html || '<p>現在予定されているライブはありません。</p>';
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('live-list').innerHTML = '<p>ライブ情報の読み込みに失敗しました。</p>';
                });
        });
    </script>
</body>
</html>
