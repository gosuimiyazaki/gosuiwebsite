<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホで適切な縮尺で表示させるための必須タグ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>午睡の音源を聴こう</title>

    <style>
        body {
            background-image: url('hosi.png');
            background-size: 70%;
            margin: 0;
            padding: 10px;
        }

        .header-box {
            background-color: #74B5EA;
            color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .content {
            width: 100%;
            max-width: 600px; /* プレイヤーが小さくなりすぎないよう幅を拡張 */
            margin: 0 auto;
            box-sizing: border-box;
        }

        .content img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* オーディオプレイヤーの幅を100%にして表示崩れを防ぐ */
        .content audio {
            width: 100%;
            display: block;
            margin: 10px 0;
        }

        .menu-btn {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 30px;
      height: 22px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
    }
    .menu-btn span {
      width: 100%;
      height: 3px;
      background-color: #fff;
      border-radius: 2px;
      transition: all 0.3s ease;
    }
    .menu-btn.active span:nth-child(1) {
      transform: translateY(9.5px) rotate(45deg);
    }
    .menu-btn.active span:nth-child(2) {
      opacity: 0;
    }
    .menu-btn.active span:nth-child(3) {
      transform: translateY(-9.5px) rotate(-45deg);
    }
    .nav-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 200px;
      height: 100vh;
      background-color: #ffff
      padding-top: 60px;
      transition: right 0.3s ease;
      z-index: 99;
    }
    .nav-menu.active {
      right: 0;
    }
    .nav-menu ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .nav-menu li a {
      display: block;
      padding: 15px 20px;
      color: #fff;
      text-decoration: none;
    }
    </style>
</head>

<body>


  
        <button class="menu-btn" id="menuBtn">
        <span></span>
        <span></span>
        <span></span>
    </button>


        <nav class="nav-menu" id="navMenu">
        <ul>
            <li><a href="#about">アンケート</a></li>
            
        </ul>
    </nav>
  
       


    <div class="header-box">
        <h1>午睡の音源を聴けるサイト</h1>

        <p>
            宮崎で午睡というバンドをやっています。サイトを訪れてくれてありがとう
            <br><br>
            Gt. Vo. みのわ / Gt. たける / Ba. あこ / Dr.なずな
        </p>
    </div>

    <div class="content">

        <!-- みんなの写真 -->
        <img src="syugo.jpg" alt="みんなの写真">
        <br><br>

        <p>町</p>
        <audio controls src="machinouta.mp3"></audio>

        <p>ずる休み</p>
        <audio controls src="zuruyasumi.mp3"></audio>

        <p>○○</p>
        <audio controls src="marumaru.mp3"></audio>

        <p>東京の歌</p>
        <audio controls src="tokyonouta.mp3"></audio>

        <br><br>

        <!-- 町の写真 -->
        <img src="machi.png" alt="町写真">
        <br><br>

        <p>おまけの絵</p>

        <!-- ミニアルバム -->
        <img src="mini.png" alt="ミニアルバム">
        <br><br>

        <!-- イカ捌き -->
        <img src="ikanoe.png" alt="イカ捌き">
        <br><br>

    </div>
    
<div style="margin-top: 15px;">
    <a href="https://instagram.com/gosui_band" target="_blank" style="display: inline-block; padding: 8px 16px; background-color: #E1306C; color: white; text-decoration: none; border-radius: 20px; font-weight: bold; margin-right: 10px;">Instagram</a>
    <a href="https://twitter.com/gosui_band" target="_blank" style="display: inline-block; padding: 8px 16px; background-color: #000000; color: white; text-decoration: none; border-radius: 20px; font-weight: bold;">X (Twitter)</a>
</div>
    <script>
    const menuBtn = document.getElementById('menuBtn');
    const navMenu = document.getElementById('navMenu');

    menuBtn.addEventListener('click', () => {
      menuBtn.classList.toggle('active');
      navMenu.classList.toggle('active');
    });
  </script>
</body>
</html>
