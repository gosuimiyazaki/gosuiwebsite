<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホで適切な縮尺で表示させるための必須タグ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アンケート</title>

  <style>
    body {
      background-image: url('hosiusu.png');
      background-size: 70%;
      margin: 0;
      padding: 10px;
      font-family: sans-serif;
    }

    .container {
      max-width: 800px;
      width: 90%;
      margin: 0 auto;
      padding: 0 20px;
      box-sizing: border-box;
      text-align: center; /* コンテンツ全体を中央揃え */
    }

    /* ヘッダーの四角いボックス */
    .header-box {
      background-color: #74B5EA;
      color: #ffffff;
      padding: 20px;
      margin-bottom: 30px;
      border-radius: 8px;
    }

    .header-box h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    /* 質問テキストのスタイル */
    .question-text {
      font-size: 1.8rem; /* サイズを大きく設定 */
      margin: 40px 0 20px 0;
      color: #333;
    }

    /* 「あやしくない」テキスト（左寄せ） */
    .sub-text {
      text-align: left;
      margin: 0 0 20px 0;
      color: #333;
    }

    /* ボタンエリアのスタイル */
    .btn-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .answer-btn {
      padding: 12px 36px;
      font-size: 1.2rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .answer-btn:active {
      transform: scale(0.98);
    }

    .btn-yes {
      background-color: #FF928C;
      color: white;
    }

    .btn-yes:hover {
      background-color: #FF6E67;
    }

    .btn-no {
      background-color: #3F8FFF;
      color: white;
    }

    .btn-no:hover {
      background-color: #006AFF;
    }

    /* ハンバーガーボタンとメニュー */
    .menu-btn {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 30px;
      height: 22px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
    }

    .menu-btn span {
      width: 100%;
      height: 3px;
      background-color: #333;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    .menu-btn.active span:nth-child(1) {
      transform: translateY(9.5px) rotate(45deg);
    }

    .menu-btn.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-btn.active span:nth-child(3) {
      transform: translateY(-9.5px) rotate(-45deg);
    }

    .nav-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 200px;
      height: 100vh;
      background-color: #ffffff;
      padding-top: 60px;
      transition: right 0.3s ease;
      z-index: 99;
      box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
    }

    .nav-menu.active {
      right: 0;
    }

    .nav-menu ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .nav-menu li a {
      display: block;
      padding: 15px 20px;
      color: #333333;
      text-decoration: none;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    .nav-menu li a:hover {
      background-color: #f5f5f5;
    }

    /* ポップアップ（モーダル）スタイル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      display: none; /* 初期状態は非表示 */
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-content {
      background-color: #FFEEE6;
      padding: 30px;
      border-radius: 12px;
      max-width: 400px;
      width: 85%;
      position: relative;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      text-align: center; /* ポップアップ内の要素を中央揃え */
    }

    /* 右上のバッテンボタン */
    .modal-close-x {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.8rem;
      font-weight: bold;
      color: #888;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close-x:hover {
      color: #333;
    }

    .popup-title {
      font-size: 1.3rem;
      margin-bottom: 15px;
      color: #333;
    }

    /* 挿入予定のイラスト用スタイル */
    .popup-image {
      max-width: 100%;
      height: auto;
      margin: 15px auto 0 auto; /* 中央配置 */
      display: block;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <!-- ハンバーガーボタン -->
  <button class="menu-btn" id="menuBtn" aria-label="メニューを開く">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- ドロップダウンメニュー -->
  <nav class="nav-menu" id="navMenu">
    <ul>
      <li><a href="index.html">トップページへ戻る</a></li>
      <li><a href="hennayume.html">変な夢</a></li>
    </ul>
  </nav>

  <!-- メインコンテンツ領域 -->
  <div class="container">
    <div class="header-box">
      <h1>アンケート</h1>
    </div>

    <p class="question-text">もし百万円あげるよって言われたら？</p>
    <p class="sub-text">（あやしくないよ！午睡一同より）</p>

    <!-- 受け取る / 受け取らない ボタン -->
    <div class="btn-container">
      <button class="answer-btn btn-yes" id="yesBtn">受け取る</button>
      <button class="answer-btn btn-no" id="noBtn">受け取らない</button>
    </div>
  </div>

  <!-- ポップアップ（モーダル）構造 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <!-- 右上のバッテンボタン -->
      <button class="modal-close-x" id="modalCloseX" aria-label="閉じる">&times;</button>
      
      <!-- メッセージ表示部 -->
      <div class="popup-title" id="popupMessage"></div>

      <!-- イラスト画像表示部 -->
      <img id="popupImg" class="popup-image" src="sample.png" alt="イラスト" style="display: none;">
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    // ハンバーガーメニューの開閉処理
    const menuBtn = document.getElementById('menuBtn');
    const navMenu = document.getElementById('navMenu');

    menuBtn.addEventListener('click', () => {
      menuBtn.classList.toggle('active');
      navMenu.classList.toggle('active');
    });

    // モーダル要素の取得
    const modalOverlay = document.getElementById('modalOverlay');
    const popupMessage = document.getElementById('popupMessage');
    const popupImg = document.getElementById('popupImg');
    const modalCloseX = document.getElementById('modalCloseX');

    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');

    // 「受け取る」をクリックしたときの処理
    yesBtn.addEventListener('click', () => {
      popupMessage.textContent = 'おめでとう。百万ポイントゲット！';
      
      // イラストを表示（表示したい画像ファイル名に置き換えてください）
      popupImg.src = 'hyakuman.png';
      popupImg.style.display = 'block';

      modalOverlay.classList.add('show');
    });

    // 「受け取らない」をクリックしたときの処理
    noBtn.addEventListener('click', () => {
      popupMessage.textContent = 'すごい！了解！';
      
      // 画像は非表示
      popupImg.style.display = 'none';

      modalOverlay.classList.add('show');
    });

    // ポップアップを閉じる処理（バッテンボタン）
    modalCloseX.addEventListener('click', () => {
      modalOverlay.classList.remove('show');
    });
  </script>

</body>
</html>
